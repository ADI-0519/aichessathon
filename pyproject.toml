[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"challengers/**" = ["I001"]

[tool.mypy]
strict = true
mypy_path = "current"
files = [
    "current/agent.py",
    "harness",
    "tools/build_suite.py",
    "tools/backtest.py",
    "tools/backtest_core.py",
    "tools/pentanomial_sprt.py",
    "tools/numba_search_scaling.py",
    "tools/cli.py",
    "tools/analyze_pgn_stockfish.py",
    "tools/build_critical_suite_from_analysis.py",
    "tools/materialize_search_lab.py",
    "tools/search_ablations.py",
    "tools/search_diagnostics.py",
    "tools/search_memory_replay.py",
    "tools/evaluation_dataset.py",
    "tools/evaluation_features.py",
    "tools/fit_hce.py",
    "tools/label_positions.py",
    "tools/sample_evaluation_positions.py",
    "tools/nnue_features.py",
    "tools/pack_nnue_data.py",
    "tools/train_nnue.py",
    "tools/halfkp_features.py",
    "tools/train_halfkp.py",
    "tools/lift_halfkp.py",
    "tools/verify_halfkp.py",
    "tools/prune_halfkp.py",
    "tools/materialize_nnue_blend.py",
    "tools/verify_v5_nnue.py",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
